<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notenscan-Nachbearbeitung</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--fg:#222;--muted:#777;--line:#d8d8d4;--acc:#2a6df4;--accfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d1f;--panel:#2a2a2d;--fg:#e8e8e8;--muted:#999;--line:#444;--acc:#5b8cff;--accfg:#fff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
#main{display:grid;grid-template-columns:250px 1fr 160px;height:100vh}
aside{background:var(--panel);overflow:auto;padding:10px}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);padding:10px 8px}
#right .split .main,#bExport{font-size:13px;white-space:nowrap}
#right .split .main{min-width:0}
h3{margin:26px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
h3:first-child{margin-top:0}
button,select,input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
.row label{flex:1;min-width:90px}
.row input[type=number]{width:80px}
.btns button{flex:1}
#right .row input[type=number]{width:52px;padding:5px 6px}
#right .row label{white-space:nowrap;min-width:0}
#right select{max-width:100%}
#eMode{width:100%}
#thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px;margin-top:8px;align-items:start}
.thumb{border:2px solid transparent;border-radius:4px;cursor:pointer;position:relative;line-height:0;user-select:none}
.thumb.sel{border-color:var(--acc)}
.thumb.cur{box-shadow:0 0 0 2px var(--acc)}
.thumb canvas{width:100%;display:block;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.thumb span{position:absolute;left:50%;transform:translateX(-50%);top:2px;font-size:11px;line-height:1.2;background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:0 4px}
.thumb .tdel{position:absolute;right:4px;top:2px;font-size:11px;line-height:1.2;padding:0 5px;border:none;border-radius:3px;background:rgba(0,0,0,.55);color:#fff}
.thumb .tdel:hover{background:rgba(200,40,40,.95);border:none}
.thumb .tadd{position:absolute;left:4px;top:2px;font-size:11px;line-height:1.2;padding:0 5px;border:none;border-radius:3px;background:rgba(0,0,0,.55);color:#fff}
.thumb .tadd:hover{background:var(--acc);border:none}
.tspacer{display:flex;align-items:center;justify-content:center;aspect-ratio:210/297}
.tspacer button{font-size:18px;padding:6px 14px}
.tspacer button:hover:not(:disabled){border-color:rgba(200,40,40,.95);color:rgba(200,40,40,.95)}
.split{position:relative;display:flex;margin:5px 0}
.split .main{flex:1;border-radius:6px 0 0 6px;white-space:nowrap;padding:5px 4px}
.split .more{border-radius:0 6px 6px 0;margin-left:-1px;padding:5px 8px}
.split .more.primary{border-left:1px solid rgba(255,255,255,.45)}
.menu{position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:4px;padding:4px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.menu[hidden]{display:none}
.menu button{border:none;background:transparent;text-align:left;padding:7px 10px}
.menu button:hover{background:var(--bg)}
/* 2 × 2: oben Alle | Markierte, unten Gerade | Ungerade (wie in der Doppelseite: gerade links) */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:5px 0 5px 1px}
.seg button{text-align:center;font-size:12px;padding:4px 2px;border:1px solid var(--line);border-radius:0;margin:-1px 0 0 -1px;background:var(--panel)}
.seg button:nth-child(1){border-radius:6px 0 0 0}
.seg button:nth-child(2){border-radius:0 6px 0 0}
.seg button:nth-child(3){border-radius:0 0 0 6px}
.seg button:nth-child(4){border-radius:0 0 6px 0}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);position:relative}
.rotq button{display:flex;justify-content:center;padding:4px}
.rotq svg{width:22px;height:22px;overflow:visible;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rotq .guide{stroke-opacity:.3;stroke-width:1.4;stroke-dasharray:1.6 2.2}
input::placeholder{color:var(--muted);font-style:italic}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
#tools button,#tools select{font-size:13px;padding:4px 8px}
#tMove{display:flex;align-items:center;gap:6px;font-size:13px}
.tsep{width:1px;align-self:stretch;margin:2px 4px;background:var(--line)}
.thumb.dragging{opacity:.4}
.thumb[data-drop=before]::before,.thumb[data-drop=after]::after{content:'';position:absolute;left:-6px;right:-6px;height:3px;background:var(--acc);border-radius:2px}
.thumb[data-drop=before]::before{top:-6px}
.thumb[data-drop=after]::after{bottom:-6px}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;min-width:0;min-height:0;position:relative}
#views{display:flex;gap:14px;align-items:flex-start;justify-content:center}
.pv{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);cursor:grab;touch-action:none}
.pv.drag{cursor:grabbing}
.pv.blocked{cursor:not-allowed}
.pv.empty{background:transparent;box-shadow:none;outline:2px dashed var(--line);cursor:default}
.pv.sel{outline:2px solid var(--acc);outline-offset:2px}
.pv.cur{outline:4px solid var(--acc);outline-offset:2px}
#rotWrap{display:flex;align-items:center;gap:8px}
#rot{flex:1;min-width:0}
#rotVal{width:64px;text-align:right;font-variant-numeric:tabular-nums}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none;padding:30px}
#status{font-size:12px;color:var(--muted);min-height:1.4em;margin-top:8px}
body.over #stage{outline:3px dashed var(--acc);outline-offset:-8px}
.hint{font-size:12px;color:var(--muted)}
#busy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.2);z-index:100;padding:16px}
#busy.on{display:flex}
#busy>div{background:var(--panel);color:var(--fg);padding:20px 26px;border-radius:10px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:90vw}
.bar{width:260px;max-width:70vw;height:8px;margin:12px auto 0;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.spin{width:34px;height:34px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){#main{grid-template-columns:1fr;grid-template-rows:auto 70vh auto;height:auto}}
</style>
</head>
<body>
<div id="main">
  <aside id="left">
    <h3>Seiten</h3>
    <div id="thumbs"></div>
  </aside>

  <section id="stage">
    <div id="empty">Scans (PDF oder Bilder) hierher ziehen<br>oder rechts «Dateien öffnen» wählen.</div>
    <div id="tools">
      <label id="tMove" title="Inhalt mit der Maus ziehen oder mit den Pfeiltasten verschieben (0,2 mm, mit Shift 1 mm)">Verschieben
        <select id="dSel">
          <option value="sel">Markierte Seiten</option>
          <option value="odd">Alle ungeraden</option>
          <option value="even">Alle geraden</option>
          <option value="all">Alle Seiten</option>
        </select></label>
      <i class="tsep"></i>
      <button id="tDup" title="Aktive Seite duplizieren; die Kopie kommt direkt dahinter">Duplizieren</button>
      <i class="tsep"></i>
      <button id="tSplitPrep" title="Waagrechten Strich auf der aktiven Seite zeigen">Teilen vorbereiten</button>
      <button id="tSplitDo" title="Seite am Strich teilen">Teilen ausführen</button>
      <button id="tCut" title="Bereich auf der aktiven Seite aufziehen und ausschneiden">Ausschneiden</button>
      <button id="tPaste" title="Ausgeschnittenen Bereich auf der aktiven Seite einfügen">Einfügen</button>
      <button id="tPasteDone" title="Eingefügtes Stück fest auf der Seite platzieren">Einfügen abschliessen</button>
      <button id="tCancel" title="Teilen, Ausschneiden oder Einfügen abbrechen">Abbrechen</button>
      <i class="tsep"></i>
      <button id="tRect" aria-pressed="false" title="Ein: auf der Seite weisse Rechtecke aufziehen, die den Inhalt verdecken. Ein Klick wählt ein Rechteck (rot).">Rechteck ziehen</button>
      <button id="tRectDel" title="Gewähltes Rechteck entfernen, sonst das zuletzt gezogene (auch mit Entf)">Rechteck löschen</button>
    </div>
    <div id="views">
      <canvas id="cvL" class="pv" width="10" height="10"></canvas>
      <canvas id="cvR" class="pv" width="10" height="10"></canvas>
    </div>
    <div id="rotWrap">
      <button id="rM" title="Regler nach links">◀</button>
      <input id="rot" type="range" min="-3" max="3" step="0.01" value="0">
      <button id="rP" title="Regler nach rechts">▶</button>
      <span id="rotVal">0,00°</span>
      <button id="rReset" title="Drehung zurücksetzen">0</button>
    </div>
  </section>

  <aside id="right">
    <h3>Dateien</h3>
    <div class="row"><button id="bOpen" class="primary">Dateien öffnen …</button></div>
    <input id="file" type="file" accept="application/pdf,image/*" multiple hidden>

    <h3>Seiten anpassen</h3>
    <div class="seg" id="pSeg" role="radiogroup" aria-label="Seiten">
      <button data-g="all" role="radio" class="on" aria-checked="true">Alle</button><button data-g="sel" role="radio">Markierte</button><button data-g="even" role="radio">Gerade</button><button data-g="odd" role="radio">Ungerade</button>
    </div>
    <div class="row"><label>Grösse (%)</label><input id="gScale" type="number" step="0.5" min="10" value="100"></div>
    <div class="row"><label>Höhe (%)</label><input id="gSty" type="number" step="0.5" value="0"></div>
    <div class="row"><label>Rand (mm)</label><input id="mR" type="number" value="12" step="1" min="0"></div>
    <div class="row btns rotq">
      <button data-dq="-90" title="90° gegen den Uhrzeigersinn drehen" aria-label="90° gegen den Uhrzeigersinn drehen"><svg viewBox="-1 -1 26 26"><circle class="guide" cx="12" cy="12" r="8"/><path d="M12 4A8 8 0 0 0 4 12"/><path d="M1.3 9.3L4 12.6L6.7 9.3"/></svg></button>
      <button data-dq="180" title="180° drehen" aria-label="180° drehen"><svg viewBox="-1 -1 26 26"><circle class="guide" cx="12" cy="12" r="8"/><path d="M12 4A8 8 0 0 1 12 20"/><path d="M14.7 17.3L11.4 20L14.7 22.7"/></svg></button>
      <button data-dq="90" title="90° im Uhrzeigersinn drehen" aria-label="90° im Uhrzeigersinn drehen"><svg viewBox="-1 -1 26 26"><circle class="guide" cx="12" cy="12" r="8"/><path d="M12 4A8 8 0 0 1 20 12"/><path d="M17.3 9.3L20 12.6L22.7 9.3"/></svg></button>
    </div>

    <div class="split" id="aSplit">
      <button id="aAll" class="primary main" title="Gerade drehen, Grösse und Ausrichten für die oben gewählten Seiten">Automatisch alles</button><button id="aMore" class="primary more" aria-haspopup="menu" aria-expanded="false" title="Einzelnen Schritt für die oben gewählten Seiten">▾</button>
      <div class="menu" id="aMenu" role="menu" hidden>
        <button id="aRot" role="menuitem">Gerade drehen</button>
        <button id="aScale" role="menuitem" title="Gleiche Grösse für die gewählten Seiten, sodass nichts über den Rand ragt">Grösse</button>
        <button id="aAlign" role="menuitem">Ausrichten</button>
      </div>
    </div>
    <div class="split" id="rSplit">
      <button id="rAll" class="main" title="Drehung, Grösse und Ausrichtung der oben gewählten Seiten zurücksetzen">Zurücksetzen alles</button><button id="rMore" class="more" aria-haspopup="menu" aria-expanded="false" title="Einzelnen Teil der oben gewählten Seiten zurücksetzen">▾</button>
      <div class="menu" id="rMenu" role="menu" hidden>
        <button data-reset="rot" role="menuitem" title="Feindrehung und 90°-Drehung">Drehung</button>
        <button data-reset="size" role="menuitem" title="Grösse und Höhe zusätzlich">Grösse</button>
        <button data-reset="pos" role="menuitem" title="Verschiebung">Ausrichtung</button>
      </div>
    </div>


    <h3>Export</h3>
    <div class="row">
      <select id="eMode" aria-label="Exportmodus">
        <option value="auto" title="Volle Auflösung; PNG bei PNG-, BMP- und GIF-Bildern, sonst JPEG 95 %">Wie Quelle</option>
        <option value="png" title="Volle Auflösung, immer PNG">Verlustfrei (PNG)</option>
        <option value="small">Verkleinert</option>
      </select></div>
    <div class="row" id="eSmall" hidden><label>Auflösung</label>
      <select id="eDpi"><option>100</option><option>150</option><option selected>200</option><option>300</option></select></div>
    <div class="row" id="eSmallQ" hidden><label>JPEG-Qualität</label>
      <select id="eQ"><option value="0.6">60 %</option><option value="0.75" selected>75 %</option><option value="0.85">85 %</option></select></div>
    <div class="row btns"><button id="bExport" class="primary" disabled>Als A4-PDF speichern</button></div>
    <div id="status"></div>
  </aside>
</div>

<div id="busy" role="status" aria-live="polite"><div><div class="spin"></div><div id="busyMsg">Lade …</div><div class="bar" id="busyBar" hidden><i id="busyFill"></i></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rad = d => d * Math.PI / 180;
const A4W = 210, A4H = 297;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pages = [];
let cur = -1;                 // aktive Seite (Index)
let selSet = new Set();       // markierte Seiten (Seitenobjekte)
let anchor = 0;               // Ankerseite für Shift-Auswahl
let rectMode = false, rubber = null, selRect = null;   // weisse Rechtecke (selRect = Ebene)
// Werkzeugleiste: mode = 'split' | 'cut' | 'place' | null; clip = ausgeschnittenes, noch nicht fertig eingefügtes Stück
let mode = null, clip = null, placing = null, splitY = 0;

function setStatus(t) { $('status').textContent = t; if (busy) $('busyMsg').textContent = t; }

// Während des Imports ist die ganze Oberfläche gesperrt (Overlay + inert)
let busy = false;
function setBusy(on, msg = '') {
  busy = on;
  $('main').inert = on;
  $('busy').classList.toggle('on', on);
  $('busyMsg').textContent = msg;
  setProgress(null);
  document.body.style.cursor = on ? 'progress' : '';
}
// Fortschritt 0..1 als Balken; null blendet ihn aus
function setProgress(f) {
  $('busyBar').hidden = f == null;
  if (f != null) $('busyFill').style.width = (Math.max(0, Math.min(1, f)) * 100) + '%';
}

/* ---------- Laden ---------- */
// Die Canvas-Bilder sind nur Vorschau und Analyse. Der Export lädt die Originaldaten (p.src) in voller Auflösung neu.
const PREV_LONG = 2200;

function makePage(c, name, src, an) {
  // layers: in Reihenfolge gezeichnet: weisse Rechtecke {t:'rect', poly} und eingefügte Stücke {t:'piece', …}
  const p = { name, src, prev: c, rot: 0, q: 0, dx: 0, dy: 0, k: 1, sy: 0, m: MARGIN0, layers: [], aspect: c.height / c.width, ink: null, thumb: null };
  if (an) Object.assign(p, an); else analyze(p);
  pages.push(p);
  return p;
}

async function addImage(f) {
  const bytes = await f.arrayBuffer();
  const bmp = await createImageBitmap(new Blob([bytes]));
  const s = Math.min(1, PREV_LONG / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.imageSmoothingQuality = 'high';
  x.drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  makePage(c, f.name, { kind: 'img', bytes });
}

// Seiten werden auf mehrere pdf.js-Worker verteilt (je einer pro Dokumentkopie), so viele wie sinnvoll:
// höchstens Kerne − 1, höchstens 8. Übernommen werden die Seiten in ihrer Reihenfolge.
let anaPool = null;
// Vorschau als ImageBitmap an einen Worker; dort verkleinern, auslesen und analysieren (braucht OffscreenCanvas)
async function analyzeInWorker(c) {
  if (typeof OffscreenCanvas === 'undefined') { const { d, w, h } = analyzeInput({ prev: c }); return analyzePixels(d, w, h); }
  if (!anaPool) {
    const src = [shadowBands, analyzePixels].map(String).join(';') +
      ';onmessage = e => { const { id, bmp, w, h } = e.data, oc = new OffscreenCanvas(w, h), x = oc.getContext("2d", { willReadFrequently: true });' +
      ' x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h); bmp.close();' +
      ' const r = analyzePixels(x.getImageData(0, 0, w, h).data, w, h); postMessage({ id, r }, [r.ink.buffer]); };';
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const n = Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 2) - 1));
    anaPool = { ws: Array.from({ length: n }, () => new Worker(url)), next: 0, id: 0, wait: new Map() };
    anaPool.ws.forEach(wk => wk.onmessage = e => { const f = anaPool.wait.get(e.data.id); anaPool.wait.delete(e.data.id); f(e.data.r); });
  }
  const P = anaPool, id = ++P.id, wk = P.ws[P.next++ % P.ws.length];
  const sc = Math.min(1, 1500 / c.width), w = Math.max(1, Math.round(c.width * sc)), h = Math.max(1, Math.round(c.height * sc));
  const bmp = await createImageBitmap(c);
  return new Promise(res => { P.wait.set(id, res); wk.postMessage({ id, bmp, w, h }, [bmp]); });
}
// Grösste Bildbreite im PDF aus den Bild-Wörterbüchern (unkomprimierter Text, Bilder sind nie in Objektströmen).
// Viel schneller als pdf.js-Operatorlisten, die jedes Bild dekodieren. Gilt für alle Seiten der Datei.
function pdfMaxImageWidth(bytes) {
  const s = new TextDecoder('latin1').decode(bytes), re = /\/Subtype\s*\/Image/g;
  let m, best = 0;
  while ((m = re.exec(s))) {
    const a = s.lastIndexOf('obj', m.index), b = s.indexOf('stream', m.index);
    const dict = s.slice(a < 0 ? Math.max(0, m.index - 2000) : a, b < 0 ? m.index + 2000 : b);
    const w = /\/Width\s+(\d+)(?!\s+\d+\s+R)/.exec(dict);
    if (w) best = Math.max(best, +w[1]);
  }
  return best;
}
async function addPdf(f) {
  if (!window.pdfjsLib) throw new Error('pdf.js konnte nicht geladen werden (Internet?)');
  const bytes = await f.arrayBuffer();
  const open = () => pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;   // eigener Worker pro Dokument
  const first = await open(), n = first.numPages, pxW = pdfMaxImageWidth(bytes);
  const k = Math.max(1, Math.min(n, 8, (navigator.hardwareConcurrency || 2) - 1));
  const docs = [first, ...await Promise.all(Array.from({ length: k - 1 }, open))];
  const done = Array.from({ length: n }, () => { let res, rej; const pr = new Promise((a, b) => { res = a; rej = b; }); return { pr, res, rej }; });
  let next = 0, rendered = 0;
  const run = async doc => {
    while (next < n) {
      const i = next++;
      try {
        const pg = await doc.getPage(i + 1);
        const v1 = pg.getViewport({ scale: 1 });
        const vp = pg.getViewport({ scale: PREV_LONG / Math.max(v1.width, v1.height) });
        const c = document.createElement('canvas');
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
        await pg.render({ canvasContext: x, viewport: vp }).promise;
        pg.cleanup();
        const an = await analyzeInWorker(c);
        setStatus(`${f.name}: ${++rendered}/${n} Seiten gelesen …`);
        done[i].res({ c, an });
      } catch (e) { done[i].rej(e); }
    }
  };
  const pool = Promise.all(docs.map(run));
  try {
    for (let i = 0; i < n; i++) {   // Seiten in ihrer Reihenfolge übernehmen
      const { c, an } = await done[i].pr;
      makePage(c, `${f.name} S.${i + 1}`, { kind: 'pdf', bytes, index: i, pxW }, an);
    }
  } finally {
    await pool.catch(() => {});
    docs.forEach(d => d.destroy());
  }
}

async function addFiles(list) {
  if (busy) { setStatus('Bitte warten, der aktuelle Import läuft noch.'); return; }
  const coll = new Intl.Collator(undefined, { numeric: true });
  const files = [...list].sort((a, b) => coll.compare(a.name, b.name));
  const first = pages.length;
  setBusy(true, 'Lade Dateien …');
  try {
    for (const f of files) {
      try {

  return { L: X0 / r - bw / 2, R: (X1 + 1) / r - bw / 2, T: Y0 / r - bh / 2, B: (Y1 + 1) / r - bh / 2, staves: staves.length };
}

// Fortschritt der Automatik: zählt Seitenschritte; zeigt Schritt, Seite x/n, Balken und geschätzte Restzeit
let prog = null;
const fmtDur = ms => { const t = Math.ceil(ms / 1000); return t < 60 ? `${t} s` : `${Math.floor(t / 60)} min ${String(t % 60).padStart(2, '0')} s`; };
// Gewicht je Schritt (gemessen): Gerade drehen ist schneller als Messen
const W_ROT = 0.65;
async function progStep(label, i, n, w = 1) {
  if (!prog) return;
  prog.done += w;
  const now = performance.now();
  if (now - prog.last < 80 && prog.done < prog.total - 1e-6) return;   // höchstens ~12 Anzeigen pro Sekunde
  prog.last = now;
  const el = now - prog.t0, rest = el / prog.done * (prog.total - prog.done);
  $('busyMsg').textContent = `${label}: Seite ${i}/${n}` + (el > 1500 && rest > 500 ? ` · noch ca. ${fmtDur(rest)}` : '');
  setProgress(prog.done / prog.total);
  await new Promise(r => setTimeout(r));
}

async function autoRotate(list) {
  for (let i = 0; i < list.length; i++) { list[i].rot = detectAngle(list[i]); await progStep('Gerade drehen', i + 1, list.length, W_ROT); }
}

// Grösse: die Seiten der Liste messen; die breiteste und die höchste bestimmen einen gemeinsamen Faktor,
// sodass keine davon über den Rand ragt. Keine Streckung (Höhe zusätzlich = 0). Übrige Seiten bleiben.
async function autoScale(list = pages) {
  if (!list.length) return;
  const sv = list.map(p => [p.k, p.sy]);
  list.forEach(p => { p.k = 1; p.sy = 0; });
  let maxW = 0, maxH = 0;
  for (let i = 0; i < list.length; i++) {
    const b = measure(list[i]);
    if (b) { maxW = Math.max(maxW, b.R - b.L); maxH = Math.max(maxH, b.B - b.T); }
    await progStep('Grösse messen', i + 1, list.length);
  }
  if (!maxW || !maxH) { list.forEach((p, i) => { [p.k, p.sy] = sv[i]; }); return; }
  // bei verschiedenen Rändern zählt der grösste, damit alle Seiten passen
  const m = Math.max(...list.map(margin)), s = Math.min((A4W - 2 * m) / maxW, (A4H - 2 * m) / maxH);
  list.forEach(p => { p.k = Math.floor(s * 10000) / 10000; });
}

async function autoAlign(list) {
  for (let i = 0; i < list.length; i++) {   // immer zentriert
    const p = list[i], b = measure(p);
    if (b) { p.dx = -(b.L + b.R) / 2; p.dy = -(b.T + b.B) / 2; }
    await progStep('Ausrichten', i + 1, list.length);
  }
}


/* ---------- Anzeige ---------- */
// Ansichten: immer Doppelseite. Seite 1 rechts, 2 links, 3 rechts, …; links von Seite 1 bleibt leer.
const views = [{ cv: $('cvL') }, { cv: $('cvR') }];
function viewIdxs() {
  const s = Math.floor((cur + 1) / 2);
  return [2 * s - 1, 2 * s];
}

let raf = 0;
function draw() {
  updateTools();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const idxs = viewIdxs();
    views.forEach((v, vi) => {
      const cv = v.cv, ctx = cv.getContext('2d'), idx = idxs[vi], p = pages[idx];
      cv.classList.toggle('empty', !p);
      cv.classList.toggle('cur', !!p && idx === cur);
      cv.classList.toggle('sel', !!p && idx !== cur && selSet.has(p));
      cv.classList.toggle('blocked', !!p && !mode && !moveAllows(idx));
      if (!p) { ctx.clearRect(0, 0, cv.width, cv.height); return; }
      const ppm = cv.width / A4W;
      renderPage(ctx, p, ppm);
      if (rectMode) {   // Rechtecke als Umriss zeigen (ausgewähltes rot), plus das gerade aufgezogene
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
        setPageTransform(ctx, p, ppm, p.prev);

            const X = M.a * x + M.c * y + M.e, Y = M.b * x + M.d * y + M.f;

        ctx.save(); ctx.setLineDash([5, 3]); ctx.lineWidth = lw;

        ctx.strokeRect((rubber.X0 + A4W / 2) * ppm, (rubber.Y0 + A4H / 2) * ppm, (rubber.X1 - rubber.X0) * ppm, (rubber.Y1 - rubber.Y0) * ppm);
        ctx.restore();

        ctx.restore();

        ctx.save(); ctx.lineWidth = 1;
        for (let mm = 0; mm <= A4W; mm += 5) {

          ctx.beginPath(); ctx.moveTo(Math.round(mm * ppm) + .5, 0); ctx.lineTo(Math.round(mm * ppm) + .5, A4H * ppm); ctx.stroke();
        }

          ctx.beginPath(); ctx.moveTo(0, Math.round(mm * ppm) + .5); ctx.lineTo(A4W * ppm, Math.round(mm * ppm) + .5); ctx.stroke();
        }
        ctx.restore();
      }

}

function fitCanvas() {
  const st = $('stage'), rw = $('rotWrap'), gap = 14;
  const availW = st.clientWidth - 24, availH = st.clientHeight - rw.offsetHeight - $('tools').offsetHeight - 24 - 20;
  const perW = (availW - gap) / 2;
  const w = Math.max(80, Math.min(perW, availH * A4W / A4H)), h = w * A4H / A4W;
  const dpr = window.devicePixelRatio || 1;
  views.forEach(v => {
    v.cv.style.width = w + 'px'; v.cv.style.height = h + 'px';
    v.cv.width = Math.round(w * dpr); v.cv.height = Math.round(h * dpr);
  });
  rw.style.width = (2 * w + gap) + 'px';

}

let dragPage = null;   // gerade in der Miniaturenliste gezogene Seite
// Seiten (lead, und bei Mehrfachauswahl alle markierten) vor/nach die Zielseite setzen
function movePages(lead, target, after) {
  const moving = selSet.has(lead) && selSet.size > 1 ? pages.filter(p => selSet.has(p)) : [lead];
  const tp = pages[target];
  if (!tp || moving.includes(tp)) return;
  const rest = pages.filter(p => !moving.includes(p));
  rest.splice(rest.indexOf(tp) + (after ? 1 : 0), 0, ...moving);
  pages.length = 0; pages.push(...rest);

// Seiten entfernen; die Auswahl springt auf die Seite an der Stelle der ersten entfernten

  if (clip && list.includes(clip.origin)) { setStatus('Diese Seite enthält den ausgeschnittenen Bereich. Erst «Einfügen» oder «Abbrechen».'); return; }
  const del = new Set(list), first = pages.findIndex(p => del.has(p));
  for (let i = pages.length - 1; i >= 0; i--) if (del.has(pages[i])) pages.splice(i, 1);
  selectOnly(Math.max(0, Math.min(first, pages.length - 1)));

}

}

function syncUI() {
  $('empty').style.display = pages.length ? 'none' : 'flex';
  syncMove();
  updateTools();
  const sv = pages[cur] ? -pages[cur].rot : 0;
  $('rot').value = sv;
  $('rotVal').textContent = (Math.abs(sv) < 0.005 ? 0 : sv).toFixed(2).replace('.', ',') + '°';
  // Grösse / Höhe der gewählten Seitengruppe; verschiedene Werte: leeres Feld mit «gemischt»
  const t = targetsFor(pageGroup());
  [['gScale', p => Math.round(p.k * 10000) / 100], ['gSty', p => Math.round((p.sy || 0) * 100) / 100], ['mR', margin]].forEach(([id, f]) => {
    const el = $(id); if (document.activeElement === el) return;

/* ---------- Interaktion ---------- */
// Raster erscheint nur beim Verstellen des Winkels

  gridTemp = true; clearTimeout(gridTimer);
  gridTimer = setTimeout(() => { if (gridHeld) return bumpGrid(); gridTemp = false; draw(); }, 1200);
}
$('rot').addEventListener('pointerdown', () => { gridHeld = true; });
window.addEventListener('pointerup', () => { if (gridHeld) { gridHeld = false; bumpGrid(); } });

  const v = parseFloat(e.target.value); if (!isFinite(v) || v < 0) return;
  targetsFor(pageGroup()).forEach(p => { p.m = v; });
  draw(); drawAllThumbs();
});

const clampRot = v => Math.max(-3, Math.min(3, Math.round(v * 100) / 100));
// Die aktive Seite erhält den Wert; weitere markierte Seiten werden um dieselbe Differenz gedreht
function setRot(v) {
  const p = pages[cur]; if (!p) return;
  bumpGrid();
  const nv = clampRot(v), d = nv - p.rot;
  targetsFor('sel').forEach(t => { t.rot = t === p ? nv : clampRot(t.rot + d); });
  syncUI(); draw();
}
// Reglerwert = -Drehwinkel: Regler nach rechts dreht gegen den Uhrzeigersinn
$('rot').oninput = e => setRot(-parseFloat(e.target.value));
$('rM').onclick = () => pages[cur] && setRot(pages[cur].rot + 0.05);
$('rP').onclick = () => pages[cur] && setRot(pages[cur].rot - 0.05);
$('rReset').onclick = () => { targetsFor('sel').forEach(t => { t.rot = 0; }); syncUI(); draw(); };

// nach der Wahl Fokus weg, damit die Pfeiltasten wieder den Inhalt verschieben
$('dSel').onchange = e => { e.target.blur(); syncUI(); draw(); };
// Seite 1, 3, 5 … hat Index 0, 2, 4 … und steht in der Doppelseite rechts
const moveAllows = i => { const v = $('dSel').value; return v === 'odd' ? i % 2 === 0 : v === 'even' ? i % 2 === 1 : true; };

function syncMove() {
  const sel = $('dSel'), [l, r] = viewIdxs(), has = { odd: !!pages[r], even: !!pages[l] };
  sel.querySelector('[value=odd]').disabled = !has.odd;
  sel.querySelector('[value=even]').disabled = !has.even;

  if ((v === 'odd' || v === 'even') && !has[v]) sel.value = 'sel';

  else if (v === 'even' && cur !== l) selectOnly(l);
}
function shift(ddx, ddy) {

}
// «Seiten anpassen»: Umschalter wählt die Gruppe (bleibt stehen), Drehen relativ in 90°-Schritten
const pageGroup = () => { const b = document.querySelector('#pSeg .on'); return b ? b.dataset.g : 'all'; };
$('pSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setSeg($('pSeg'), b); syncUI(); } });
document.querySelectorAll('[data-dq]').forEach(b => b.onclick = () => {
  const d = +b.dataset.dq;
  targetsFor(pageGroup()).forEach(p => { p.q = ((p.q + d) % 360 + 360) % 360; });
  syncUI(); draw(); drawAllThumbs();
});
$('gScale').addEventListener('input', e => {
  const v = parseFloat(e.target.value); if (!isFinite(v) || v < 10) return;
  targetsFor(pageGroup()).forEach(p => { p.k = v / 100; });

});
$('gSty').addEventListener('input', e => {   // darf negativ sein
  const v = parseFloat(e.target.value); if (!isFinite(v) || v <= -90) return;

['gScale', 'gSty', 'mR'].forEach(id => $(id).addEventListener('change', () => syncUI()));

// Maus auf einer der beiden Seiten: verschieben oder (im Rechteck-Modus) Rechteck aufziehen
let drag = null;

views.forEach((v, vi) => {
  const cv = v.cv;

    const idx = viewIdxs()[vi], p = pages[idx]; if (!p) return;
    if (mode) {   // Teilen / Ausschneiden / Einfügen wirken nur auf der aktiven Seite
      if (idx !== cur) return;
      const [X, Y] = toMm(e, cv);
      if (mode === 'place') {   // nur Ziehen auf dem Stück verschiebt es, daneben passiert nichts
        const { piece, host } = placing, c = piece.clip, ox = piece.ox + host.dx, oy = piece.oy + host.dy;
        if (X < c.x0 + ox || X > c.x1 + ox || Y < c.y0 + oy || Y > c.y1 + oy) return;

      } else if (mode === 'split') {

function finishRect() {

function updateTools() {

  $('left').inert = locked; $('right').inert = locked; $('rotWrap').inert = locked;
  $('bExport').disabled = !pages.length || !!clip;
  const cursor = { split: 'ns-resize', cut: 'crosshair', place: 'move' }[mode] || (rectMode ? 'crosshair' : '');
  views.forEach(v => { v.cv.style.cursor = cursor; });
}
const toolsDone = msg => { if (msg) setStatus(msg); syncUI(); draw(); drawAllThumbs(); };

$('tSplitPrep').onclick = () => {
  if (!pages[cur]) return;
  mode = 'split'; splitY = 0; rectMode && $('tRect').click();
  toolsDone('Strich auf die gewünschte Höhe ziehen, dann «Teilen ausführen».');
};
$('tSplitDo').onclick = () => {
  const S = pages[cur]; if (mode !== 'split' || !S) return;
  const D = clonePage(S, S.name + ' (Teil 2)');
  S.layers.push(rectFromMm(S, -A4W, splitY, A4W, A4H));    // erste Seite: unterhalb weiss
  D.layers.push(rectFromMm(D, -A4W, -A4H, A4W, splitY));   // zweite Seite: oberhalb weiss
  pages.splice(cur + 1, 0, D);
  mode = null;
  rebuildThumbs();
  toolsDone(`Seite ${cur + 1} geteilt.`);
};
$('tCut').onclick = () => {
  if (!pages[cur] || clip) return;
  mode = 'cut'; rectMode && $('tRect').click();
  toolsDone('Bereich auf der aktiven Seite aufziehen.');
};
function finishCut() {
  const r = rubber, S = r.p; rubber = null;
  const x0 = Math.min(r.X0, r.X1), x1 = Math.max(r.X0, r.X1), y0 = Math.min(r.Y0, r.Y1), y1 = Math.max(r.Y0, r.Y1);
  if (x1 - x0 < 2 || y1 - y0 < 2) { draw(); return; }   // zu klein: weiter im Ausschneiden-Modus
  const snap = snapshotOf(S);                           // vor dem Weissmachen einfrieren
  const cover = rectFromMm(S, x0, y0, x1, y1);
  S.layers.push(cover);
  clip = { snap, clip: { x0, y0, x1, y1 }, origin: S, cover };
  mode = null;
  toolsDone('Ausgeschnitten. Zielseite wählen und «Einfügen» klicken, oder «Abbrechen».');
}
$('tPaste').onclick = () => {
  const host = pages[cur]; if (!host || !clip || mode) return;
  // erscheint an derselben Stelle wie auf der Ursprungsseite
  const piece = { t: 'piece', snap: clip.snap, clip: clip.clip, ox: -host.dx, oy: -host.dy };
  host.layers.push(piece);
  placing = { host, piece }; mode = 'place';
  toolsDone('Stück an die richtige Stelle ziehen, dann «Einfügen abschliessen».');
};
$('tPasteDone').onclick = () => {
  if (mode !== 'place') return;
  mode = null; placing = null; clip = null;
  toolsDone('Eingefügt.');
};
$('tCancel').onclick = () => {
  if (mode === 'place') { const L = placing.host.layers, i = L.indexOf(placing.piece); if (i >= 0) L.splice(i, 1); placing = null; }
  if (clip && (mode === 'place' || !mode)) {   // Stück zurück auf die Ursprungsseite
    const L = clip.origin.layers, i = L.indexOf(clip.cover); if (i >= 0) L.splice(i, 1);
    clip = null;
  }
  mode = null; rubber = null;
  toolsDone('Abgebrochen.');
};
$('tRect').onclick = () => {
  rectMode = !rectMode; if (!rectMode) selRect = null;
  $('tRect').classList.toggle('primary', rectMode);
  $('tRect').setAttribute('aria-pressed', rectMode);
  updateTools();
  draw();
};
$('tRectDel').onclick = delRect;

document.addEventListener('keydown', e => {
  if (busy || mode) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range') return;
  if (rectMode && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); delRect(); return; }
  const st = e.shiftKey ? 1 : 0.2;
  const m = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
  if (m && pages[cur]) { e.preventDefault(); shift(m[0], m[1]); }
});


// Automatik sperrt die Oberfläche (Overlay) und zeigt den Fortschritt; steps = Durchgänge über die Seiten
const autoGroup = pageGroup;
const autoList = g => g === 'all' ? pages : targetsFor(g);
const runAuto = (steps, fn) => async () => {
  if (!pages.length || busy) return;
  const g = autoGroup(), t = autoList(g); if (!t.length) return;
  setBusy(true, 'Automatik läuft …');
  prog = { total: steps * t.length, done: 0, t0: performance.now(), last: 0 }; setProgress(0);
  await new Promise(r => setTimeout(r, 30));
  try { await fn(t, g); } finally { prog = null; setBusy(false); syncUI(); draw(); drawAllThumbs(); }
};
$('aAll').onclick = runAuto(W_ROT + 2, async (t, g) => {
  await autoRotate(t); await autoScale(t); await autoAlign(t);
  setStatus(`Automatik angewendet: ${GROUP[g]} (${t.length}).`);
});
$('aRot').onclick = runAuto(W_ROT, async (t, g) => { await autoRotate(t); setStatus(`Gerade gedreht: ${GROUP[g]} (${t.length}).`); });
$('aScale').onclick = runAuto(1, async (t, g) => { await autoScale(t); setStatus(`Grösse bestimmt: ${GROUP[g]} (${t.length}).`); });
$('aAlign').onclick = runAuto(1, async (t, g) => { await autoAlign(t); setStatus(`Ausgerichtet: ${GROUP[g]} (${t.length}).`); });
// Split-Buttons: ▾ klappt das Menü auf (nur eines gleichzeitig); Auswahl oder Klick daneben schliesst
const splitMenus = [];
function setSeg(seg, btn) {
  seg.querySelectorAll('button').forEach(b => { const on = b === btn; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
}
document.querySelectorAll('.split').forEach(root => {
  const more = root.querySelector('.more'), menu = root.querySelector('.menu');
  const set = open => { menu.hidden = !open; more.setAttribute('aria-expanded', open); };
  splitMenus.push(set);
  more.onclick = e => { e.stopPropagation(); const open = menu.hidden; splitMenus.forEach(s => s(false)); set(open); };
  menu.addEventListener('click', e => { if (e.target.closest('[role=menuitem]')) set(false); });
  document.addEventListener('click', e => { if (!root.contains(e.target)) set(false); });
});

// Zurücksetzen, aufgebaut wie die Automatik (Rechtecke, Teilungen und Stücke bleiben):
// Drehung = fein + 90°, Grösse = Grösse und Höhe zusätzlich, Ausrichtung = Verschiebung
const GROUP = { all: 'Alle Seiten', sel: 'Markierte Seiten', odd: 'Ungerade Seiten', even: 'Gerade Seiten' };
const WHAT = { all: 'alles', rot: 'Drehung', size: 'Grösse', pos: 'Ausrichtung' };
function resetPages(g, what) {
  const t = g === 'all' ? pages : targetsFor(g); if (!t.length) return;
  const any = k => what === 'all' || what === k;
  t.forEach(p => {
    if (any('rot')) { p.rot = 0; p.q = 0; }
    if (any('size')) { p.k = 1; p.sy = 0; }
    if (any('pos')) { p.dx = 0; p.dy = 0; }
  });
  syncUI(); draw(); drawAllThumbs();
  setStatus(`Zurückgesetzt: ${GROUP[g]}, ${WHAT[what]} (${t.length}).`);
}
$('rAll').onclick = () => resetPages(pageGroup(), 'all');
document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetPages(pageGroup(), b.dataset.reset));

/* ---------- Seiten verwalten ---------- */
function blankPage() {
  const c = document.createElement('canvas'); c.width = 420; c.height = 594;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return { name: 'Leere Seite', src: { kind: 'blank' }, prev: c, rot: 0, q: 0, dx: 0, dy: 0, k: 1, sy: 0, m: MARGIN0, layers: [], aspect: c.height / c.width, ink: new Float32Array(0), thumb: null };
}
$('tDup').onclick = () => {   // nur die aktive Seite
  const p = pages[cur]; if (!p || mode || clip) return;
  const d = clonePage(p, p.name + ' (Kopie)');
  pages.splice(cur + 1, 0, d);
  selectOnly(cur + 1); selRect = null;
  rebuildThumbs(); syncUI(); draw();
  setStatus(`Seite ${cur} dupliziert.`);
};

/* ---------- Dateien ---------- */
$('bOpen').onclick = () => $('file').click();
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
// Nur Datei-Drags aufnehmen; das Umsortieren der Miniaturen läuft separat
const hasFiles = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
['dragenter', 'dragover'].forEach(t => window.addEventListener(t, e => { if (!hasFiles(e)) return; e.preventDefault(); document.body.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => window.addEventListener(t, e => { if (!hasFiles(e)) return; e.preventDefault(); if (t === 'drop' || e.target === document.documentElement) document.body.classList.remove('over'); }));
window.addEventListener('drop', e => { document.body.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- Export ---------- */
$('eMode').onchange = () => { const s = $('eMode').value === 'small'; $('eSmall').hidden = !s; $('eSmallQ').hidden = !s; };

// Originalquelle in voller Auflösung laden (Bild oder gerenderte PDF-Seite)
// Verlustfreie Quelle? Nur PNG-, BMP- und GIF-Bilder (an den ersten Bytes erkannt); PDF-Scans enthalten fast immer JPEG
function losslessSrc(s) {
  if (s.kind !== 'img') return false;
  const b = new Uint8Array(s.bytes, 0, Math.min(4, s.bytes.byteLength));
  return (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) || (b[0] === 0x42 && b[1] === 0x4D) || (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46);
}
// «Wie Quelle»: PNG nur, wenn alle beteiligten Scans (Seite und eingefügte Stücke) verlustfrei sind
function pageLossless(q) {
  return (q.src.kind === 'blank' || losslessSrc(q.src)) && q.layers.every(l => l.t !== 'piece' || pageLossless(l.snap));
}
async function loadSource(p, cache) {
  const s = p.src;
  if (s.kind === 'blank') return p.prev;
  if (s.kind === 'img') return await createImageBitmap(new Blob([s.bytes]));
  let doc = cache.get(s.bytes);
  if (!doc) { doc = await pdfjsLib.getDocument({ data: s.bytes.slice(0) }).promise; cache.set(s.bytes, doc); }
  const pg = await doc.getPage(s.index + 1), v1 = pg.getViewport({ scale: 1 });
  let sc = s.pxW > 0 ? s.pxW / v1.width : 300 / 72;
  sc = Math.min(sc, 7000 / Math.max(v1.width, v1.height));
  const vp = pg.getViewport({ scale: sc });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  await pg.render({ canvasContext: x, viewport: vp }).promise;
  return c;
}

$('bExport').onclick = async () => {
  if (!pages.length || busy) return;
  if (!window.PDFLib) { setStatus('pdf-lib konnte nicht geladen werden (Internet?)'); return; }
  const mode = $('eMode').value, dpi = parseInt($('eDpi').value), qSmall = parseFloat($('eQ').value);
  const n = pages.length, cache = new Map();
  setBusy(true, 'Export vorbereiten …');
  setProgress(0);
  $('bExport').disabled = true;
  try {
    const doc = await PDFLib.PDFDocument.create();
    for (let i = 0; i < n; i++) {
      const p = pages[i];
      setProgress(i / n); setStatus(`Seite ${i + 1}/${n}`);
      await new Promise(r => setTimeout(r, 10));
      if (p.src.kind === 'blank' && !p.layers.some(l => l.t === 'piece')) { doc.addPage([595.28, 841.89]); continue; }
      // Originale der Seite und aller eingefügten Stücke laden (rekursiv)
      const imgs = new Map();
      const preload = async q => {
        if (!imgs.has(q.src)) imgs.set(q.src, await loadSource(q, cache));
        for (const l of q.layers) if (l.t === 'piece') await preload(l.snap);
      };
      await preload(p);
      // Auflösung: die feinste der beteiligten Scans (Pixel pro mm)
      const finest = q => {
        let m = 0;
        if (q.src.kind !== 'blank') { const im = imgs.get(q.src), { fx, fy } = factors(q); m = Math.max(im.width / fx, im.height / fy); }
        for (const l of q.layers) if (l.t === 'piece') m = Math.max(m, finest(l.snap));
        return m;
      };
      let ppm = mode === 'small' ? dpi / 25.4 : (finest(p) || 300 / 25.4);
      ppm = Math.min(ppm, 33); // ca. 840 dpi als Obergrenze
      const c = document.createElement('canvas'); c.width = Math.round(A4W * ppm); c.height = Math.round(A4H * ppm);
      renderPage(c.getContext('2d'), p, c.width / A4W, q => imgs.get(q.src) || q.prev);
      imgs.forEach(im => im.close && im.close());
      const png = mode === 'png' || (mode === 'auto' && pageLossless(p));
      const blob = await new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', mode === 'small' ? qSmall : 0.95));
      c.width = c.height = 1;
      const bytesImg = new Uint8Array(await blob.arrayBuffer());
      const emb = png ? await doc.embedPng(bytesImg) : await doc.embedJpg(bytesImg);
      const pg = doc.addPage([595.28, 841.89]);
      pg.drawImage(emb, { x: 0, y: 0, width: 595.28, height: 841.89 });
    }
    setProgress(1); setStatus(`Speichere PDF (${n} Seiten) …`);
    cache.forEach(d => d.destroy && d.destroy());
    const bytes = await doc.save();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    a.download = 'noten-a4.pdf'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus(`Fertig: ${n} Seite(n), ${(bytes.length / 1048576).toFixed(1)} MB.`);
  } catch (e) { console.error(e); setStatus('Export-Fehler: ' + e.message); }
  finally { setBusy(false); $('bExport').disabled = false; }
};

new ResizeObserver(fitCanvas).observe($('stage'));
window.addEventListener('resize', fitCanvas);
fitCanvas(); syncUI();
</script>
</body>
</html>
